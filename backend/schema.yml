      required:
      - refresh
    PaginatedLeadList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Lead'
    PaginatedUserSummaryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
    PatchedLeadNoteUpdateRequest:
      type: object
      description: Serializer used when updating a lead note.
      properties:
        content:
          type: string
          minLength: 1
    PatchedLeadUpdateRequest:
      type: object
      description: Validate the fields accepted when updating a lead.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 55
        last_name:
          type: string
          minLength: 1
          maxLength: 55
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        company:
          type: string
          maxLength: 100
        source:
          type: string
          maxLength: 50
    StatusEnum:
      enum:
      - NEW
      - CONTACTED
      - QUALIFIED
      - PROPOSAL
      - WON
      - LOST
      type: string
      description: |-
        * `NEW` - New
        * `CONTACTED` - Contacted
        * `QUALIFIED` - Qualified
        * `PROPOSAL` - Proposal
        * `WON` - Won
        * `LOST` - Lost
    Token:
      type: object
      description: Serialize JWT access and refresh tokens.
      properties:
        access:
          type: string
          description: JWT access token.
        refresh:
          type: string
          description: JWT refresh token.
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      description: Serialize read-only user account details.
      properties:
        id:
          type: integer
          readOnly: true
          description: Unique user identifier.
        email:
          type: string
          format: email
          readOnly: true
          description: Registered email address.
        first_name:
          type: string
          readOnly: true
          description: User's first name.
        last_name:
          type: string
          readOnly: true
          description: User's last name.
        role:
          type: string
          readOnly: true
          description: Assigned user role.
      required:
      - email
      - first_name
      - id
      - last_name
      - role
    UserSummary:
      type: object
      description: Serialize a lightweight representation of a user.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
          description: User's full name.
      required:
      - full_name
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentication
  description: Endpoints for user authentication and JWT token management.
