openapi: 3.0.3
info:
  title: Lead Management API
  version: 1.0.0
  description: REST API for managing leads, assignments, notes, activities and authentication.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate a user using their email address and password. Returns
        JWT access and refresh tokens.
      summary: Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              examples:
                LoginSuccess:
                  value:
                    access: <jwt-access-token>
                    refresh: <jwt-refresh-token>
                  summary: Login Success
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request could not be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Unauthorized:
                  value:
                    detail: No active account found with the given credentials
          description: Authentication credentials are invalid or missing.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist the supplied refresh token so it cannot be used to obtain
        new access tokens.
      summary: Logout
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request could not be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve details of the currently authenticated user.
      summary: Current User
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                User:
                  value:
                    id: 1
                    email: admin@example.com
                    first_name: Akash
                    last_name: Damle
                    role: ADMIN
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: 'Generate a new access token using a valid refresh token. Refresh
        tokens are rotated: the response includes a new refresh token and the submitted
        one is blacklisted.'
      summary: Refresh Access Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              examples:
                TokenRefresh:
                  value:
                    access: <new-access-token>
                    refresh: <new-refresh-token>
                  summary: Token Refresh
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Unauthorized:
                  value:
                    detail: No active account found with the given credentials
          description: Authentication credentials are invalid or missing.
  /api/auth/users/:
    get:
      operationId: auth_users_list
      description: Return all active members available for lead assignment.
      summary: List Users
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserSummaryList'
              examples:
                UserSummary:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: 1
                      full_name: Akash Damle
                  summary: User Summary
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
  /api/leads/:
    get:
      operationId: leads_list
      description: Returns a paginated list of leads visible to the authenticated
        user. Supports search, filtering and ordering.
      summary: List visible leads
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: integer
        description: Filter by assigned member.
      - in: query
        name: company
        schema:
          type: string
      - in: query
        name: created_by
        schema:
          type: integer
        description: Filter by creator.
      - in: query
        name: ordering
        schema:
          type: string
        description: Order by created_at, updated_at, first_name, last_name or status.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by first name, last name, email, phone or company.
      - in: query
        name: source
        schema:
          type: string
        description: Filter by lead source.
      - in: query
        name: status
        schema:
          type: string
        description: Filter by lead status.
      tags:
      - Leads
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeadList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
    post:
      operationId: leads_create
      description: Create a new lead. The lead is automatically created with status
        NEW and is initially unassigned.
      summary: Create a lead
      tags:
      - Leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request could not be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
  /api/leads/{id}/:
    get:
      operationId: leads_retrieve
      description: Retrieve a single lead that is visible to the authenticated user.
      summary: Retrieve a lead
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Unique lead identifier.
        required: true
      tags:
      - Leads
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
    put:
      operationId: leads_update
      description: Update lead information. Status changes and assignment are handled
        through dedicated endpoints.
      summary: Update a lead
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Unique lead identifier.
        required: true
      tags:
      - Leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeadUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeadUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request could not be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
    patch:
      operationId: leads_partial_update
      description: Update lead information. Status changes and assignment are handled
        through dedicated endpoints.
      summary: Update a lead
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Unique lead identifier.
        required: true
      tags:
      - Leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLeadUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLeadUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLeadUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request could not be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
    delete:
      operationId: leads_destroy
      description: Permanently delete a lead visible to the authenticated user.
      summary: Delete a lead
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Unique lead identifier.
        required: true
      tags:
      - Leads
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Lead deleted successfully.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
  /api/leads/{id}/activities/:
    get:
      operationId: leads_activities_list
      description: Retrieve activities recorded for a lead visible to the authenticated
        user.
      summary: List lead activities
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Unique lead identifier.
        required: true
      tags:
      - Leads
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadActivity'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
  /api/leads/{id}/assign/:
    post:
      operationId: leads_assign_create
      description: Assign a lead to an active member. Administrator access is required.
      summary: Assign a lead
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Unique lead identifier.
        required: true
      tags:
      - Leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignLeadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignLeadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignLeadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request could not be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
  /api/leads/{id}/notes/:
    post:
      operationId: leads_notes_create
      description: Create a note for a lead and record the related activity.
      summary: Add a lead note
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this lead.
        required: true
      tags:
      - Leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadNoteCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeadNoteCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeadNoteCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadNote'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request could not be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
  /api/leads/{id}/notes/list/:
    get:
      operationId: leads_notes_list_list
      description: Retrieve all notes for a lead visible to the authenticated user.
      summary: List lead notes
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this lead.
        required: true
      tags:
      - Leads
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadNote'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
  /api/leads/{id}/status/:
    post:
      operationId: leads_status_create
      description: Change a lead's status when the requested transition is allowed.
      summary: Change a lead's status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Unique lead identifier.
        required: true
      tags:
      - Leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeLeadStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeLeadStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeLeadStatusRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request could not be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
  /api/leads/notes/{id}/:
    put:
      operationId: replaceLeadNote
      description: Replace the content of a lead note (PUT). Same rules as updating
        it.
      summary: Replace a lead note
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Unique note identifier.
        required: true
      tags:
      - Leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadNoteUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeadNoteUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeadNoteUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadNote'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request could not be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
    patch:
      operationId: updateLeadNote
      description: Update the content of a lead note. Only its author or an administrator
        may edit it.
      summary: Update a lead note
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Unique note identifier.
        required: true
      tags:
      - Leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLeadNoteUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLeadNoteUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLeadNoteUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadNote'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request could not be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
    delete:
      operationId: deleteLeadNote
      description: Permanently delete a lead note the authenticated user may manage.
      summary: Delete a lead note
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Unique note identifier.
        required: true
      tags:
      - Leads
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Lead note deleted successfully.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication credentials are invalid or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: You do not have permission to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Requested resource was not found.
  /api/leads/public/:
    post:
      operationId: leads_public_create
      description: Create a new lead without authentication.
      summary: Submit a public lead
      tags:
      - Public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
components:
  schemas:
    ActivityTypeEnum:
      enum:
      - CREATED
      - STATUS_CHANGED
      - ASSIGNED
      - NOTE_ADDED
      - UPDATED
      type: string
      description: |-
        * `CREATED` - Created
        * `STATUS_CHANGED` - Status Changed
        * `ASSIGNED` - Assigned
        * `NOTE_ADDED` - Note Added
        * `UPDATED` - Updated
    AssignLeadRequest:
      type: object
      description: Validate the member selected to receive a lead assignment.
      properties:
        assigned_to:
          type: integer
          description: ID of the user to assign the lead to.
      required:
      - assigned_to
    ChangeLeadStatusRequest:
      type: object
      description: Validate a requested lead status change.
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            New status for the lead.

            * `NEW` - New
            * `CONTACTED` - Contacted
            * `QUALIFIED` - Qualified
            * `PROPOSAL` - Proposal
            * `WON` - Won
            * `LOST` - Lost
      required:
      - status
    Error:
      type: object
      description: Serialize standard API error details.
      properties:
        detail:
          type: string
          description: Error description.
      required:
      - detail
    Lead:
      type: object
      description: Serialize lead details for retrieval.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 55
        last_name:
          type: string
          maxLength: 55
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        company:
          type: string
          maxLength: 100
        source:
          type: string
          maxLength: 50
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
          description: The user who created the lead.
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
          nullable: true
          description: The user currently assigned to the lead, or null if unassigned.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_to
      - created_at
      - created_by
      - email
      - first_name
      - id
      - last_name
      - status
      - updated_at
    LeadActivity:
      type: object
      description: Serializer used for retrieving lead activities.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
          description: The user who performed the activity.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        activity_type:
          allOf:
          - $ref: '#/components/schemas/ActivityTypeEnum'
          readOnly: true
        description:
          type: string
          readOnly: true
        lead:
          type: integer
          readOnly: true
      required:
      - activity_type
      - created_at
      - description
      - id
      - lead
      - updated_at
      - user
    LeadCreateRequest:
      type: object
      description: Validate the fields accepted when creating a lead.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 55
        last_name:
          type: string
          minLength: 1
          maxLength: 55
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        company:
          type: string
          maxLength: 100
        source:
          type: string
          maxLength: 50
      required:
      - email
      - first_name
      - last_name
    LeadNote:
      type: object
      description: Serializer used for retrieving lead notes.
      properties:
        id:
          type: integer
          readOnly: true
        lead:
          type: integer
        content:
          type: string
        author:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
          description: The user who created the note.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - content
      - created_at
      - id
      - lead
      - updated_at
    LeadNoteCreateRequest:
      type: object
      description: Serializer used when creating a lead note.
      properties:
        content:
          type: string
          minLength: 1
      required:
      - content
    LeadNoteUpdateRequest:
      type: object
      description: Serializer used when updating a lead note.
      properties:
        content:
          type: string
          minLength: 1
      required:
      - content
    LeadUpdateRequest:
      type: object
      description: Validate the fields accepted when updating a lead.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 55
        last_name:
          type: string
          minLength: 1
          maxLength: 55
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        company:
          type: string
          maxLength: 100
        source:
          type: string
          maxLength: 50
      required:
      - email
      - first_name
      - last_name
    LoginRequestRequest:
      type: object
      description: Validate credentials submitted for authentication.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Registered email address.
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: User password.
      required:
      - email
      - password
    LogoutRequest:
      type: object
      description: Validate a refresh token for invalidation.
      properties:
        refresh:
          type: string
          minLength: 1
