# Render Blueprint: one free Docker web service serving the API, admin and
# frontend. The database is external (Neon free Postgres); Render's own free
# Postgres is deleted 30 days after creation. See docs/DEPLOY.md.
services:
  - type: web
    name: lead-platform
    runtime: docker
    plan: free
    # Fixed at creation; pick the region closest to users and to the database
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # index.html is served without touching the database
    healthCheckPath: /
    envVars:
      # Random 256-bit value generated by Render on first deploy
      - key: SECRET_KEY
        generateValue: true
      # Neon connection string, entered in the dashboard (never committed)
      - key: DATABASE_URL
        sync: false
      # First admin account, created once on start (see ensure_superuser)
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # ALLOWED_HOSTS / CORS_ALLOWED_ORIGINS / CSRF_TRUSTED_ORIGINS default to
      # the service's onrender.com host; set them only for a custom domain.
