# Weekly dependency update PRs. Minor and patch bumps are grouped into one PR
# per ecosystem; major versions get their own PR so breaking changes are
# reviewed individually. Every PR must pass the required Backend/Frontend
# checks before it can merge.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(backend)

  # pnpm projects use the npm ecosystem; Dependabot updates pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler) drops the JS compiler API that
      # openapi-typescript uses to generate src/types/api.ts; revisit once
      # openapi-typescript supports it
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node's types should match the Node version the app runs on (CI and
      # the Docker image use Node 22), not the newest Node release
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(frontend)
