# Weekly dependency update PRs. Minor and patch bumps are grouped into one PR
# per ecosystem; major versions get their own PR so breaking changes are
# reviewed individually. Every PR must pass the required Backend/Frontend
# checks before it can merge.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(backend)

  # pnpm projects use the npm ecosystem; Dependabot updates pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(frontend)
