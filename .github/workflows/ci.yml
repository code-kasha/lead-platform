name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-insecure-secret-key-not-used-anywhere-else
      DATABASE_URL: "sqlite:///:memory:"
      DJANGO_ENV: development
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt flake8==7.4.1

      - name: Lint (flake8)
        run: flake8 .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Check OpenAPI schema is up to date
        run: |
          python manage.py spectacular --validate --file "$RUNNER_TEMP/schema.yml"
          diff -u schema.yml "$RUNNER_TEMP/schema.yml" || {
            echo "::error file=backend/schema.yml::schema.yml is stale. Run 'python manage.py spectacular --file schema.yml' and commit it."
            exit 1
          }

      - name: Tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API types are up to date
        run: |
          pnpm exec openapi-typescript ../backend/schema.yml -o "$RUNNER_TEMP/api.ts"
          diff -u src/types/api.ts "$RUNNER_TEMP/api.ts" || {
            echo "::error file=frontend/src/types/api.ts::Generated types are stale. Run 'pnpm exec openapi-typescript ../backend/schema.yml -o src/types/api.ts' and commit it."
            exit 1
          }

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t lead-platform:ci .

      # Start the real image (SQLite stands in for Postgres) and check that it
      # migrates, serves the SPA, static files and the API
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 \
            -e SECRET_KEY=ci-only-insecure-secret-key-not-used-anywhere-else \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 \
            -e ALLOWED_HOSTS=localhost \
            -e CORS_ALLOWED_ORIGINS=http://localhost:8000 \
            -e CSRF_TRUSTED_ORIGINS=http://localhost:8000 \
            -e SECURE_SSL_REDIRECT=False \
            -e DJANGO_SUPERUSER_EMAIL=admin@example.com \
            -e DJANGO_SUPERUSER_PASSWORD=ci-admin-password \
            lead-platform:ci
          for i in $(seq 60); do curl -fsS -o /dev/null http://localhost:8000/ && break; sleep 1; done
          curl -fsS http://localhost:8000/leads/7 | grep -q 'id="root"'
          curl -fsS -o /dev/null http://localhost:8000/static/admin/css/base.css
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/leads/)" = 401
          curl -fsS -X POST http://localhost:8000/api/auth/login/ \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-admin-password"}' | grep -q '"access"'

      - name: Container logs
        if: always()
        run: docker logs app || true
