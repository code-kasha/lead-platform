# Run the production image locally against Postgres:
#   docker compose up --build   ->  http://localhost:8000
# Uses demo credentials; never reuse these values in a real deployment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: local-compose-only-not-secret-change-me-for-any-real-use
      DATABASE_URL: postgres://leads:leads@db:5432/leads
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8000
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      # Plain HTTP locally; the real host terminates TLS
      SECURE_SSL_REDIRECT: "False"
      HSTS_SECONDS: "0"
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin-demo-password

volumes:
  pgdata:
